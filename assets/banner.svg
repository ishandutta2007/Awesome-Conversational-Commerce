<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse-glow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes float-item{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#cbd5e1}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}.pulsing-orb{animation:pulse-glow 6s ease-in-out infinite;transform-origin:center}.floating-card-1{animation:float-item 5s ease-in-out infinite}.floating-card-2{animation:float-item 6s ease-in-out infinite 1s}.flowing-line{stroke-dasharray:8 8;animation:dash-flow 2s linear infinite}</style><rect width="1200" height="350" fill="url(#bg-grad)" rx="16"/><circle cx="150" cy="80" r="180" fill="#4f46e5" class="pulsing-orb" filter="url(#glow)" opacity=".25"/><circle cx="1050" cy="270" r="200" fill="#db2777" class="pulsing-orb" filter="url(#glow)" opacity=".2"/><path stroke="#fff" stroke-opacity=".03" stroke-width="1" d="M 0 70 L 1200 70 M 0 14