99" points="375 46 383 50 375 54"/><g class="floating-card-1"><rect width="125" height="60" x="385" y="20" fill="url(#card-grad)" stroke="#10b981" stroke-opacity=".5" stroke-width="1.5" rx="12"/><text x="447" y="46" fill="#fff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛍️ Ecommerce</text><text x="447" y="64" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Shopify / Custom</text></g></g><rect width="1200" height="6" x="0" y="344" fill="url(#accent-grad)"/></svg>