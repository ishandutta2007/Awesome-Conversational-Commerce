<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    .node-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Dynamic Animations */
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes float-item {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }

    .pulsing-orb { animation: pulse-glow 6s ease-in-out infinite; transform-origin: center; }
    .floating-card-1 { animation: float-item 5s ease-in-out infinite; }
    .floating-card-2 { animation: float-item 6s ease-in-out infinite 1s; }
    .flowing-line { stroke-dasharray: 8 8; animation: dash-flow 2s linear infinite; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background (Behind Text & Cards) -->
  <circle cx="150" cy="80" r="180" fill="#4f46e5" opacity="0.25" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="1050" cy="270" r="200" fill="#db2777" opacity="0.2" filter="url(#glow)" class="pulsing-orb" />

  <!-- Background Decorative Grid Lines -->
  <path d="M 0 70 L 1200 70 M 0 140 L 1200 140 M 0 210 L 1200 210 M 0 280 L 1200 280" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <path d="M 200 0 L 200 350 M 400 0 L 400 350 M 600 0 L 600 350 M 800 0 L 800 350 M 1000 0 L 1000 350" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- Animated Conversational Flow Line (Left Side Decorative) -->
  <path d="M 60 260 Q 140 310 220 260 T 380 260" fill="none" stroke="url(#accent-grad)" stroke-width="3" class="flowing-line" opacity="0.6" />

  <!-- FOREGROUND CONTENT: Header Title & Subtitle (Always Clear and Visible) -->
  <g transform="translate(60, 75)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="230" height="32" rx="16" fill="url(#accent-grad)" opacity="0.9" />
    <text x="115" y="21" text-anchor="middle" class="badge-text" font-weight="700">🛒 ECOMMERCE &amp; AI CHAT</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title">Awesome Conversational Commerce</text>
    
    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">Curated SaaS Platforms, AI Agents &amp; Open-Source Messaging Ecosystem</text>
  </g>

  <!-- Interactive Dynamic Visual Cards (Bottom Right - Non-overlapping with main text) -->
  <g transform="translate(720, 160)">
    <!-- Dynamic Card 1: User / Buyer -->
    <g class="floating-card-1">
      <rect x="0" y="20" width="130" height="60" rx="12" fill="url(#card-grad)" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1.5" />
      <text x="65" y="46" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">💬 Customer</text>
      <text x="65" y="64" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">WhatsApp / Web</text>
    </g>

    <!-- Dynamic Flow Arrow 1 -->
    <path d="M 135 50 L 175 50" stroke="#a855f7" stroke-width="2" class="flowing-line" />
    <polygon points="175,46 183,50 175,54" fill="#a855f7" />

    <!-- Dynamic Card 2: AI Shopping Assistant -->
    <g class="floating-card-2">
      <rect x="185" y="10" width="145" height="80" rx="12" fill="url(#card-grad)" stroke="#ec4899" stroke-opacity="0.6" stroke-width="1.5" />
      <text x="257" y="40" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">🤖 AI Concierge</text>
      <text x="257" y="58" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="11">Order Lookup &amp; Cart</text>
      <text x="257" y="74" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="10">Instant Resolution</text>
    </g>

    <!-- Dynamic Flow Arrow 2 -->
    <path d="M 335 50 L 375 50" stroke="#ec4899" stroke-width="2" class="flowing-line" />
    <polygon points="375,46 383,50 375,54" fill="#ec4899" />

    <!-- Dynamic Card 3: Store Backend -->
    <g class="floating-card-1">
      <rect x="385" y="20" width="125" height="60" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" />
      <text x="447" y="46" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">🛍️ Ecommerce</text>
      <text x="447" y="64" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Shopify / Custom</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="344" width="1200" height="6" fill="url(#accent-grad)" />
</svg>
